# tmux Configuration
# Mirrors the Ghostty split/tab keybindings (see ghostty.config) so muscle
# memory carries over now that tmux owns panes and windows.
# Reload with: tmux source-file ~/.tmux.conf

# ─── Prefix ──────────────────────────────────────────────────────────────────
# Escape hatch for the rest of tmux (copy-mode, rename, etc.). The daily
# split/tab loop below is bound without a prefix, exactly like Ghostty.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ─── Splits (alt+m/n/e/i = new <-/down/up/right) ─────────────────────────────
# Daily loop: alt+m/n/e/i create <-/down/up/right · alt+o next · alt+y prev · alt+u close

bind -n M-m split-window -hb
bind -n M-n split-window -v
bind -n M-e split-window -v -b
bind -n M-i split-window -h

# ─── Go to Split (alt+shift+m/n/e/i = <-/down/up/right) ──────────────────────

bind -n M-M select-pane -L
bind -n M-N select-pane -D
bind -n M-E select-pane -U
bind -n M-I select-pane -R
bind -n M-o select-pane -t :.+
bind -n M-y select-pane -t :.-

# ─── Close Split (alt+u) ─────────────────────────────────────────────────────

bind -n M-u kill-pane

# ─── Resize Splits (ctrl+alt+m/n/e/i) ────────────────────────────────────────

bind -n C-M-m resize-pane -L 5
bind -n C-M-n resize-pane -D 5
bind -n C-M-e resize-pane -U 5
bind -n C-M-i resize-pane -R 5

# ─── Windows / tabs (ctrl+t new · ctrl+shift+h/l prev/next · ctrl+shift+t rename · ctrl+shift+w close)

bind -n C-t new-window
bind -n C-S-h previous-window
bind -n C-S-l next-window
bind -n C-S-t command-prompt -I "#W" "rename-window '%%'"
bind -n C-S-w confirm-before -p 'kill window #W? (y/n)' kill-window

# ─── Behaviour ───────────────────────────────────────────────────────────────

set -g mouse on
set -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1

# ─── Plugins (tpm) ───────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
set -g window-size latest
